name: CI Pipeline

on:
  push:
    branches: [ development, main, feature/*, fix/* ]
  pull_request:
    branches: [ development, main ]

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy
    
    - name: Run Black (format check)
      run: |
        black --check --diff services/
    
    - name: Run isort (import check)
      run: |
        isort --check-only --diff services/ --profile=black
    
    - name: Run Flake8 (lint)
      run: |
        flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 services/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run MyPy (type check)
      run: |
        pip install pydantic sqlalchemy[asyncio] fastapi httpx celery redis
        mypy services/user-service/app --ignore-missing-imports || true
      continue-on-error: true

  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mlh_user
          POSTGRES_PASSWORD: mlh_secure_password
          POSTGRES_DB: mlh_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./services/user-service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio httpx
    
    - name: Run tests
      working-directory: ./services/user-service
      env:
        DATABASE_URL: postgresql+asyncpg://mlh_user:mlh_secure_password@localhost:5432/mlh_db
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-only
        JWT_ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
        REFRESH_TOKEN_EXPIRE_DAYS: 7
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html || true
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./services/user-service/coverage.xml
        flags: user-service
        name: user-service-coverage
      continue-on-error: true

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    
    strategy:
      matrix:
        service: [user-service, course-service, enrollment-service, payment-service]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build ${{ matrix.service }}
      uses: docker/build-push-action@v5
      with:
        context: ./services/${{ matrix.service }}
        file: ./services/${{ matrix.service }}/Dockerfile
        push: false
        tags: mlh-${{ matrix.service }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install bandit
      run: |
        pip install bandit[toml]
    
    - name: Run Bandit security scan
      run: |
        bandit -r services/ -f json -o bandit-report.json -ll || true
      continue-on-error: true
    
    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json
      if: always()

  api-contract-tests:
    name: API Contract Tests (Newman)
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Compose
      run: |
        docker compose version
    
    - name: Start services
      run: |
        docker compose up -d postgres redis mongodb
        sleep 10
        docker compose up -d user-service course-service enrollment-service payment-service
        sleep 15
    
    - name: Wait for services to be healthy
      run: |
        echo "Waiting for services to be healthy..."
        for i in {1..30}; do
          if curl -sf http://localhost:8001/health && \
             curl -sf http://localhost:8002/health && \
             curl -sf http://localhost:8003/health && \
             curl -sf http://localhost:8004/health; then
            echo "All services are healthy!"
            break
          fi
          echo "Attempt $i: Services not ready, waiting..."
          sleep 5
        done
    
    - name: Install Newman
      run: |
        npm install -g newman newman-reporter-htmlextra
    
    - name: Run Postman Collection Tests
      run: |
        newman run docs/api-specs/postman/MLH_Platform_API.postman_collection.json \
          --env-var "user_service_url=http://localhost:8001" \
          --env-var "course_service_url=http://localhost:8002" \
          --env-var "enrollment_service_url=http://localhost:8003" \
          --env-var "payment_service_url=http://localhost:8004" \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export newman-report.html \
          --folder "User Service" \
          --folder "Course Service" \
          --bail || true
      continue-on-error: true
    
    - name: Upload Newman Report
      uses: actions/upload-artifact@v4
      with:
        name: newman-api-test-report
        path: newman-report.html
      if: always()
    
    - name: Show service logs on failure
      if: failure()
      run: |
        docker compose logs --tail=50
    
    - name: Stop services
      if: always()
      run: |
        docker compose down -v
